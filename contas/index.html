<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contas com Pokémon</title>
  <meta name="description" content="Jogos educativos de matemática com Pokémon! Multiplicação, divisão e frações para crianças." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="hub">

  <div class="container">

    <header>
      <h1>Contas com Pokémon</h1>
    </header>
    <p class="hub-subtitle">Escolha seu desafio e treine com seu Pokémon favorito!</p>

    <div class="pokemon-hero">
      <img
        id="hero-pokemon"
        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
        alt="Pokémon"
      />
    </div>

    <div class="games-grid">

      <a href="multiplicacao.html" class="game-card mult" id="card-mult">
        <span class="game-icon">✖️</span>
        <div class="game-title">Multiplicação & Divisão</div>
        <div class="game-desc">Treine multiplicação e divisão em 5 níveis de dificuldade</div>
        <span class="game-badge">20 questões</span>
      </a>

      <a href="comparafracao.html" class="game-card frac" id="card-frac">
        <span class="game-icon">⚖️</span>
        <div class="game-title">Comparar Frações</div>
        <div class="game-desc">Descubra qual fração é maior, menor ou se são iguais</div>
        <span class="game-badge">10 questões</span>
      </a>

    </div>

    <p class="hub-footer">Jogos Educativos 🎓</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
