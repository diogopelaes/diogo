<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteio CEMEP | Carregar JSON</title>
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/material-symbols:casino.svg?color=%23ff6b00">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Iconify Icon -->
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@3.0.2/dist/iconify-icon.min.js"></script>

  <!-- Tailwind (Silenciando aviso de produção) -->
  <script>
    const _warn = console.warn;
    console.warn = (...args) => {
      if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _warn(...args);
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Seu CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center p-4 md:p-10"
      style="overflow-y: auto; -webkit-overflow-scrolling: touch; align-items: flex-start; padding-top: 2rem;">

  <main class="main-container w-full max-w-2xl space-y-8">

    <header class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-600/10 text-orange-500 mb-2">
        <iconify-icon icon="lucide:shuffle" class="text-5xl"></iconify-icon>
      </div>
      <h1 class="text-4xl font-bold text-white tracking-tight">
        Sorteio de Questões
      </h1>
      <p class="text-gray-400 font-medium">Prof. Diogo | CEMEP</p>
    </header>

    <div class="glass-card p-8 space-y-6">
      <h2 class="text-xl font-bold text-white tracking-tight text-center">Carregar Sorteio</h2>
      <div class="space-y-3">
        <label class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Arquivo JSON do Sorteio</label>
        <label for="jsonInput" class="file-upload-wrapper">
          <div class="file-upload-icon">
            <iconify-icon icon="material-symbols:file-open" class="text-2xl"></iconify-icon>
          </div>
          <div class="file-upload-text">
            <span id="jsonFileName" class="block font-medium text-white">Escolher arquivo JSON</span>
            <span class="text-xs text-gray-500">Selecione o arquivo .json com as turmas, estudantes e questões</span>
          </div>
        </label>
        <input type="file" id="jsonInput" accept=".json" class="hidden">
      </div>

      <div id="jsonPreview" class="hidden rounded-xl bg-white/5 border border-white/10 p-4 text-xs text-gray-300 space-y-1">
        <div class="font-semibold text-white text-sm" id="previewTitle"></div>
        <div id="previewMeta" class="text-gray-400"></div>
      </div>

      <div class="flex flex-col sm:flex-row justify-center gap-3 w-full">
        <button id="loadJsonBtn" class="btn-primary flex-1">
          <iconify-icon icon="material-symbols:upload-file"></iconify-icon>
          Carregar Dados
        </button>
      </div>
    </div>

    <div class="glass-card p-6 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="space-y-1">
          <h3 class="text-base font-bold text-white">Não tem um arquivo pronto?</h3>
          <p class="text-xs text-gray-400 leading-relaxed">
            Baixe o JSON de modelo para editar suas turmas, estudantes e listas de questões.
            Use <code class="text-orange-400">repetir_estudante</code> e <code class="text-orange-400">repetir_numero</code> (<code class="text-gray-300">true</code> ou <code class="text-gray-300">false</code>) para configurar as repetições.
          </p>
        </div>
        <button id="downloadTemplateBtn" type="button" class="btn-secondary shrink-0">
          <iconify-icon icon="material-symbols:download" class="text-lg"></iconify-icon>
          Baixar Modelo JSON
        </button>
      </div>
    </div>

    <footer class="text-center text-xs text-gray-600 font-medium uppercase tracking-widest">
      &copy; Sorteio Super Simples
    </footer>

  </main>

  <!-- Seu script -->
  <script src="iniciar.js"></script>

</body>
</html>
