<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sorteio de Questões</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #18181b;
            color: #d4d4d8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            color: #e4e4e7;
            font-size: 24px;
            font-weight: 500;
        }

        .descricao {
            margin: 0 0 28px;
            color: #71717a;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #a1a1aa;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 11px 12px;

            border: 1px solid #3f3f46;
            border-radius: 7px;

            background: #202023;
            color: #d4d4d8;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #52525b;
        }

        .botoes {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 11px 14px;

            border: 1px solid #3f3f46;
            border-radius: 7px;

            background: #27272a;
            color: #d4d4d8;

            font-size: 15px;
            cursor: pointer;
        }

        #btnSortear {
            flex: 1;
        }

        #btnRecomecar {
            flex: 0 0 auto;
        }

        button:hover:not(:disabled) {
            background: #303034;
        }

        button:active:not(:disabled) {
            background: #3f3f46;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .status {
            margin-top: 14px;
            color: #71717a;
            font-size: 13px;
        }

        .resultado {
            margin-top: 28px;
        }

        .resultado-titulo {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 10px;

            color: #71717a;
            font-size: 14px;
        }

        .questoes {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .questao {
            padding: 10px 12px;

            border: 1px solid #27272a;
            border-radius: 6px;

            background: #202023;
            color: #a1a1aa;
        }

        .questao:first-child {
            color: #d4d4d8;
            border-color: #3f3f46;
        }

        .fim {
            margin-top: 12px;
            color: #71717a;
            font-size: 13px;
        }

        svg {
            width: 17px;
            height: 17px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Sorteio de questões</h1>

        <p class="descricao">
            Sorteio aleatório sem reposição.
        </p>

        <label for="totalQuestoes">
            Quantidade de questões
        </label>

        <input
            type="number"
            id="totalQuestoes"
            min="1"
            value="20"
        >

        <div class="botoes">

            <button id="btnSortear">
                <i data-lucide="shuffle"></i>
                Sortear
            </button>

            <button id="btnRecomecar">
                <i data-lucide="rotate-ccw"></i>
                Recomeçar
            </button>

        </div>

        <div id="status" class="status"></div>

        <section class="resultado">

            <div class="resultado-titulo">
                <i data-lucide="list"></i>
                Questões sorteadas
            </div>

            <div id="questoes" class="questoes"></div>

            <div id="fim" class="fim"></div>

        </section>

    </main>

    <script>
        lucide.createIcons();

        const totalInput =
            document.getElementById("totalQuestoes");

        const btnSortear =
            document.getElementById("btnSortear");

        const btnRecomecar =
            document.getElementById("btnRecomecar");

        const lista =
            document.getElementById("questoes");

        const status =
            document.getElementById("status");

        const fim =
            document.getElementById("fim");


        let disponiveis = [];
        let sorteadas = [];
        let total = 0;


        function iniciar() {

            total = Number(totalInput.value);

            if (!Number.isInteger(total) || total < 1) {
                alert("Informe uma quantidade válida de questões.");
                return;
            }

            // Cria as questões disponíveis:
            // 1, 2, 3, ..., total
            disponiveis = Array.from(
                { length: total },
                (_, i) => i + 1
            );

            sorteadas = [];

            lista.innerHTML = "";
            fim.textContent = "";

            btnSortear.disabled = false;

            atualizarStatus();
        }


        function sortear() {

            // Impede qualquer sorteio após o fim
            if (disponiveis.length === 0) {
                return;
            }

            /*
             * Escolhe aleatoriamente uma posição
             * entre as questões ainda disponíveis.
             */
            const indice = Math.floor(
                Math.random() * disponiveis.length
            );

            /*
             * Retira a questão da lista de disponíveis.
             *
             * Como ela foi removida, não poderá
             * ser sorteada novamente.
             */
            const [questao] =
                disponiveis.splice(indice, 1);

            sorteadas.push(questao);

            // Cria o elemento da questão
            const elemento =
                document.createElement("div");

            elemento.className = "questao";
            elemento.textContent =
                `Questão ${questao}`;

            /*
             * Insere no INÍCIO da lista.
             *
             * Assim, a última questão sorteada
             * sempre fica no topo.
             */
            lista.prepend(elemento);

            atualizarStatus();

            // Todas as questões já foram sorteadas
            if (disponiveis.length === 0) {

                btnSortear.disabled = true;

                fim.textContent =
                    "Todas as questões foram sorteadas.";
            }
        }


        function atualizarStatus() {

            const quantidadeSorteada =
                sorteadas.length;

            const restantes =
                disponiveis.length;

            if (quantidadeSorteada === 0) {

                status.textContent =
                    `${total} questões disponíveis.`;

            } else {

                status.textContent =
                    `${quantidadeSorteada} de ${total} sorteada` +
                    `${quantidadeSorteada !== 1 ? "s" : ""} · ` +
                    `${restantes} restante` +
                    `${restantes !== 1 ? "s" : ""}.`;
            }
        }


        // Um clique = uma questão
        btnSortear.addEventListener(
            "click",
            sortear
        );


        // Recomeçar com confirmação
        btnRecomecar.addEventListener(
            "click",
            () => {

                const confirmou = confirm(
                    "Tem certeza que deseja recomeçar o sorteio?\n\n" +
                    "Todas as questões já sorteadas serão apagadas."
                );

                if (confirmou) {
                    iniciar();
                }
            }
        );


        /*
         * Se o usuário alterar a quantidade,
         * pede confirmação antes de reiniciar.
         */
        totalInput.addEventListener(
            "change",
            () => {

                const confirmou = confirm(
                    "Alterar a quantidade de questões irá " +
                    "reiniciar o sorteio.\n\n" +
                    "Deseja continuar?"
                );

                if (confirmou) {
                    iniciar();
                }
            }
        );


        // Inicialização
        iniciar();
    </script>

</body>
</html>
