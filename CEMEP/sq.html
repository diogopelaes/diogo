<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sorteio de Questões</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #18181b;
            color: #d4d4d8;
            font-family: system-ui, sans-serif;
        }

        .container {
            max-width: 520px;
            margin: auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 500;
            color: #e4e4e7;
        }

        .descricao {
            margin: 0 0 28px;
            color: #71717a;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #a1a1aa;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #3f3f46;
            border-radius: 7px;
            background: #202023;
            color: #d4d4d8;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #52525b;
        }

        button {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px;
            border: 1px solid #3f3f46;
            border-radius: 7px;
            background: #27272a;
            color: #d4d4d8;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #303034;
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .status {
            margin-top: 14px;
            color: #71717a;
            font-size: 13px;
        }

        .resultado {
            margin-top: 28px;
        }

        .resultado-titulo {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #71717a;
        }

        .questoes {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .questao {
            padding: 10px 12px;
            border: 1px solid #27272a;
            border-radius: 6px;
            background: #202023;
            color: #a1a1aa;
        }

        .fim {
            margin-top: 12px;
            color: #71717a;
            font-size: 13px;
        }

        svg {
            width: 17px;
            height: 17px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Sorteio de questões</h1>

        <p class="descricao">
            Sorteie as questões aleatoriamente, sem reposição.
        </p>

        <div class="campo">
            <label for="totalQuestoes">
                Total de questões
            </label>

            <input
                type="number"
                id="totalQuestoes"
                min="1"
                value="20"
            >
        </div>

        <button id="btnSortear">
            <i data-lucide="shuffle"></i>
            Sortear
        </button>

        <div id="status" class="status"></div>

        <section class="resultado">

            <div class="resultado-titulo">
                <i data-lucide="list"></i>
                Questões sorteadas
            </div>

            <div id="questoes" class="questoes"></div>

            <div id="fim" class="fim"></div>

        </section>

    </main>

    <script>
        lucide.createIcons();

        const totalInput =
            document.getElementById("totalQuestoes");

        const botao =
            document.getElementById("btnSortear");

        const lista =
            document.getElementById("questoes");

        const status =
            document.getElementById("status");

        const fim =
            document.getElementById("fim");


        let disponiveis = [];
        let sorteadas = [];
        let total = 0;


        function iniciarSorteio() {

            total = Number(totalInput.value);

            if (!Number.isInteger(total) || total < 1) {
                status.textContent =
                    "Informe um número válido de questões.";
                return;
            }

            // Cria a lista 1, 2, 3, ..., total
            disponiveis = Array.from(
                { length: total },
                (_, i) => i + 1
            );

            sorteadas = [];

            lista.innerHTML = "";
            fim.textContent = "";

            botao.disabled = false;

            atualizarStatus();
        }


        function sortear() {

            if (disponiveis.length === 0) {
                return;
            }

            /*
             * Escolhe uma posição aleatória
             * dentro das questões ainda disponíveis.
             */
            const indice = Math.floor(
                Math.random() * disponiveis.length
            );

            /*
             * Remove a questão da lista de disponíveis.
             * Portanto, ela NÃO poderá ser sorteada novamente.
             */
            const [questao] =
                disponiveis.splice(indice, 1);

            sorteadas.push(questao);

            // Adiciona a questão no final da lista
            const elemento =
                document.createElement("div");

            elemento.className = "questao";
            elemento.textContent =
                `Questão ${questao}`;

            lista.appendChild(elemento);

            atualizarStatus();

            // Terminou todas as questões
            if (disponiveis.length === 0) {

                botao.disabled = true;

                fim.textContent =
                    "Todas as questões foram sorteadas.";
            }
        }


        function atualizarStatus() {

            const quantidade =
                sorteadas.length;

            const restantes =
                disponiveis.length;

            if (quantidade === 0) {
                status.textContent =
                    `${total} questões disponíveis.`;
            } else {
                status.textContent =
                    `${quantidade} sorteada${quantidade !== 1 ? "s" : ""} · ` +
                    `${restantes} restante${restantes !== 1 ? "s" : ""}.`;
            }
        }


        // Botão Sorteio
        botao.addEventListener(
            "click",
            sortear
        );


        // Se alterar o número de questões,
        // inicia um novo sorteio.
        totalInput.addEventListener(
            "change",
            iniciarSorteio
        );


        // Inicialização
        iniciarSorteio();
    </script>

</body>
</html>
